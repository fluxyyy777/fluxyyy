<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoshin Hub - Key System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Fireworks Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes rainbowGlow {
            0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000, inset 0 0 15px #ff0000; }
            14% { border-color: #ff7f00; box-shadow: 0 0 20px #ff7f00, inset 0 0 15px #ff7f00; }
            28% { border-color: #ffff00; box-shadow: 0 0 20px #ffff00, inset 0 0 15px #ffff00; }
            42% { border-color: #00ff00; box-shadow: 0 0 20px #00ff00, inset 0 0 15px #00ff00; }
            57% { border-color: #00ffff; box-shadow: 0 0 20px #00ffff, inset 0 0 15px #00ffff; }
            71% { border-color: #0000ff; box-shadow: 0 0 20px #0000ff, inset 0 0 15px #0000ff; }
            85% { border-color: #8b00ff; box-shadow: 0 0 20px #8b00ff, inset 0 0 15px #8b00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000, inset 0 0 15px #ff0000; }
        }

        .rainbow-border {
            border: 3px solid #ff0000;
            animation: rainbowGlow 3s linear infinite;
        }

        /* Background Animated Particles */
        body {
            background-color: #080612;
            background-image: 
                radial-gradient(at 20% 20%, rgba(120, 40, 200, 0.25) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(0, 210, 255, 0.2) 0px, transparent 50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Toast Popup Styling */
        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #00f0ff;
            color: #000;
            text-align: center;
            border-radius: 8px;
            padding: 12px 20px;
            position: fixed;
            z-index: 100;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0px 4px 15px rgba(0, 240, 255, 0.4);
            opacity: 0;
            transition: opacity 0.3s, top 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            top: 40px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Pháo hoa Canvas Background -->
    <canvas id="fireworksCanvas" class="fixed inset-0 pointer-events-none z-10"></canvas>

    <!-- Notification Toast -->
    <div id="toast">
        <i class="fa-solid fa-check-circle mr-2"></i> Đã copy script Hoshin Hub
    </div>

    <!-- Main Container Card với Viền Cầu Vồng -->
    <div class="relative z-20 w-full max-w-md bg-[#0f0c20]/90 backdrop-blur-md rounded-2xl p-6 rainbow-border text-white shadow-2xl">
        
        <!-- Header Section -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-purple-600 to-cyan-400 rounded-full mb-3 shadow-lg shadow-purple-500/30">
                <i class="fa-solid fa-gamepad text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-300 to-pink-500">
                Hoshin Hub
            </h1>
            <p class="text-sm text-cyan-300/80 font-medium mt-1">
                script Hoshin Hub
            </p>
        </div>

        <!-- System Tag Info -->
        <div class="bg-[#181330] border border-purple-500/30 rounded-xl p-3 mb-5 flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
                <i class="fa-solid fa-shield-halved text-cyan-400 mr-1.5"></i> Key System
            </span>
            <span class="text-sm font-bold text-cyan-400 bg-cyan-950/80 px-3 py-1 rounded-lg border border-cyan-500/40">
                ronnei7.htk
            </span>
        </div>

        <!-- Target Game Info -->
        <div class="bg-[#181330] border border-purple-500/30 rounded-xl p-4 mb-5">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
                <i class="fa-solid fa-egg text-yellow-400 mr-1.5"></i> Steal An Egg
            </div>
            <div class="text-xs text-gray-300 font-mono bg-[#0b0818] p-3 rounded-lg border border-gray-800 break-all select-all hover:border-purple-500/50 transition">
                loadstring(game:HttpGet("https://raw.githubusercontent.com/fluxyyy777/fluxyyy/refs/heads/main/HoshiHub-keyles.lua"))()
            </div>
        </div>

        <!-- Copy Action Button -->
        <button onclick="copyScript()" class="w-full py-3.5 px-6 bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-500 hover:from-cyan-400 hover:via-purple-500 hover:to-pink-400 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/25 active:scale-98 transition duration-200 flex items-center justify-center gap-2 text-base">
            <i class="fa-regular fa-copy text-lg"></i>
            <span>Sao chép Script Hoshin Hub</span>
        </button>

        <!-- Footer Note -->
        <div class="mt-6 pt-4 border-t border-gray-800/80 text-center text-xs text-gray-400">
            <p><i class="fa-solid fa-sparkles text-yellow-400 mr-1"></i> Tận hưởng trải nghiệm Hoshin Hub tốt nhất!</p>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const scriptCode = `loadstring(game:HttpGet("https://raw.githubusercontent.com/fluxyyy777/fluxyyy/refs/heads/main/HoshiHub-keyles.lua"))()`;

        // Copy Function với Fallback
        function copyScript() {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(scriptCode).then(showToast).catch(() => fallbackCopy());
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const tempInput = document.createElement("textarea");
            tempInput.value = scriptCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast();
        }

        // Toast Notification Function
        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // Bắn Pháo Hoa Khi Vào Trang Web (Fireworks Effect)
        window.addEventListener('load', () => {
            // Đợt 1: Bắn từ 2 góc dưới
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);

                confetti({
                    particleCount,
                    startVelocity: 30,
                    spread: 360,
                    ticks: 60,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                });
                confetti({
                    particleCount,
                    startVelocity: 30,
                    spread: 360,
                    ticks: 60,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                });
            }, 250);

            // Đợt 2: Pháo hoa nổ lớn ở giữa
            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            }, 500);
        });

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }
    </script>
</body>
</html>
