<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Family -->

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05020a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(147, 51, 234, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
        }

        /* Viền Neon phát sáng giống giao diện Hoshin Hub */
        .neon-card {
            position: relative;
            background: #0d091a;
            border-radius: 28px;
        }

        .neon-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 30px;
            background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #06b6d4, #f59e0b);
            background-size: 300% 300%;
            z-index: -1;
            animation: moveGradient 6s ease infinite;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4),
                        0 0 45px rgba(236, 72, 153, 0.25);
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.6)); }
            50% { opacity: 0.8; filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.8)); }
        }
    </style>
</head>
